name: Gatherings checks
on:
  pull_request:
  push:
    branches: [privacy-first-gatherings]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatherings-screenshots
          path: test-results/*.png
          retention-days: 7
